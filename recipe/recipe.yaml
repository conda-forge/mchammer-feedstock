schema_version: 1

context:
  name: mchammer
  version: 2026.10.21.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: fbf506edb441500bf0303f1671e546fc15351b13fc85cf93ec38974ff660ce3f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - scipy
    - networkx
tests:
  - python:
      imports:
        - mchammer
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Contains MC algorithm for optimising molecules.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/andrewtarzia/MCHammer

extra:
  recipe-maintainers:
    - jan-janssen
